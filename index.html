<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwodiStudios</title>
<style>
  :root { --bg: #f7f5fb; --card: #ffffff; --text: #1d1b26; --muted: #5d5970; --accent: #3a6ff2; --line: #e3dff0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15131c; --card: #1f1c29; --text: #ecebf2; --muted: #a9a5bb; --accent: #8fb0ff; --line: #332f42; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  h2 { margin: 24px 0 4px; font-size: 1.2rem; }
  .muted { color: var(--muted); margin-top: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<article>
  <h1>TwodiStudios</h1>
  <p class="muted">Small mobile games.</p>

  <h2>Pipe Puzzle</h2>
  <p>Connect the pipes before time runs out. Free on Android.</p>
  <p>
    <a href="https://play.google.com/store/apps/details?id=com.twodistudios.pipepuzzle">Get it on Google Play</a>
    &middot; <a href="privacy-policy.html">Privacy policy</a>
  </p>

  <h2>Contact</h2>
  <p><a href="mailto:kraldzo25@gmail.com">kraldzo25@gmail.com</a></p>
</article>
</main>
</body>
</html>
